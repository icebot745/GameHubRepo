<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found | OP Game Hub</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07060f">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Chakra+Petch:wght@400;600&display=swap">
<style>
:root { --void: #07060f; --cyan: #2ef6ff; --magenta: #ff2bd6; --ink: #e9e6ff; --dim: #8d87b8; color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
  padding: 24px max(16px, env(safe-area-inset-left, 0px));
  background: var(--void); color: var(--ink); font: 18px/1.5 "Chakra Petch", "Segoe UI", system-ui, sans-serif;
}
.box { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 46ch; }
.code { font-family: "Audiowide", "Trebuchet MS", sans-serif; font-size: clamp(72px, 18vw, 140px); line-height: 1; color: var(--magenta); text-shadow: 0 0 14px var(--magenta), 0 0 40px rgba(255,43,214,.45); }
h1 { margin: 0; font-family: "Audiowide", "Trebuchet MS", sans-serif; font-weight: 400; font-size: 26px; color: var(--cyan); }
p { margin: 0; color: var(--dim); }
a { margin-top: 6px; font-family: "Audiowide", "Trebuchet MS", sans-serif; font-size: 18px; color: var(--void); background: var(--cyan); text-decoration: none; padding: 10px 22px; border-radius: 4px; box-shadow: 0 0 14px var(--cyan); }
a:focus-visible { outline: 3px solid var(--magenta); outline-offset: 3px; }
</style>
</head>
<body>
  <div class="box">
    <div class="code" aria-hidden="true">404</div>
    <h1>This page fell off the rooftop</h1>
    <p>The page you are looking for doesn't exist or has moved.</p>
    <a href="/">Back to OP Game Hub</a>
  </div>
</body>
</html>
